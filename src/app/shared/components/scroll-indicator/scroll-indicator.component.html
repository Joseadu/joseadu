<button
    type="button"
    class="scroll-indicator"
    [class.scroll-up]="variant() === 'up'"
    [class.is-inline]="inline()"
    (click)="handleClick()"
    [attr.aria-label]="label()"
>
    @if (variant() === 'down') {
        <span class="scroll-label">{{ label() }}</span>
        <div class="mouse-icon" #icon>
            <span class="wheel-dot"></span>
        </div>
    } @else {
        <div class="arrow-up-circle" #icon>↑</div>
        <span class="scroll-label">{{ label() }}</span>
    }
</button>
